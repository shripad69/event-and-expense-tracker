name: CI/CD Pipeline

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:

    # 🔹 1. Checkout repo
    - name: Checkout code
      uses: actions/checkout@v3

    # 🔹 2. Create frontend env (for Nginx)
    - name: Create frontend .env
      run: |
        echo "VITE_API_URL=/api" > frontend/.env
        echo "VITE_STRIPE_KEY=pk_test_51TI7ArLQRiOYPdzktQHYsGukTiOKo8AGpfXxU6j1SSzFwDV3GVs7T2lTxauzEtibi3oqk9ojBS3N7OfC26NqJB3b00pO4pNnIi" >> frontend/.env

    # 🔹 3. Build frontend
    - name: Build frontend
      run: |
        cd frontend
        npm install
        npm run build

    # 🔹 4. Clean old frontend build on VM
    - name: Clean frontend_build folder on VM
      uses: appleboy/ssh-action@v0.1.10
      with:
        host: ${{ secrets.VM_HOST }}
        username: ${{ secrets.VM_USER }}
        key: ${{ secrets.VM_SSH_KEY }}
        script: |
          rm -rf ~/event-and-expense-tracker/frontend_build/*

    # 🔹 5. Upload frontend build (FIXED)
    - name: Upload frontend build to VM
      uses: appleboy/scp-action@v0.1.4
      with:
        host: ${{ secrets.VM_HOST }}
        username: ${{ secrets.VM_USER }}
        key: ${{ secrets.VM_SSH_KEY }}
        source: "frontend/dist/"
        target: "~/event-and-expense-tracker/frontend_build"
        strip_components: 1

    # 🔹 6. Deploy backend + reload Nginx
    - name: Deploy backend on VM
      uses: appleboy/ssh-action@v0.1.10
      with:
        host: ${{ secrets.VM_HOST }}
        username: ${{ secrets.VM_USER }}
        key: ${{ secrets.VM_SSH_KEY }}
        script: |
          cd ~/event-and-expense-tracker

          echo "Pull latest code..."
          git pull origin main

          echo "Installing backend dependencies..."
          cd backend
          npm install

          echo "Restarting backend..."
          pm2 restart backend || pm2 start server.js --name backend

          echo "Reloading Nginx..."
          sudo systemctl reload nginx

          echo "Deployment completed successfully!"